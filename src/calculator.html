<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EDDBC7" />
    <meta name="color-scheme" content="light" />
    <meta name="referrer" content="no-referrer" />
    <meta
      name="description"
      content="832402226 Calculator - H5 front-end. Expressions are parsed and evaluated by the Flask backend, and the history is stored in SQLite."
    />
    <title>832402226 Calculator</title>

    <!-- Empty data icon: stops the browser from requesting /favicon.ico and
         leaving 404 entries in the server log. -->
    <link rel="icon" href="data:," />

    <!-- Relative asset paths, so the page works whether it is served from
         http://127.0.0.1:8080/, from the backend on port 5000, or from a
         deployed domain. -->
    <link rel="stylesheet" href="./css/tokens.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/calculator.css" />
    <link rel="stylesheet" href="./css/history.css" />
  </head>
  <body>
    <!-- Background layer: illustration plus a soft veil so text stays readable.
         The inner element locks both layers to the width of .shell (see base.css). -->
    <div class="app-bg" aria-hidden="true">
      <div class="app-bg__inner">
        <img
          class="app-bg__image"
          id="bgImage"
          src="./static/bg.png"
          alt=""
          decoding="async"
          onerror="this.classList.add('is-hidden')"
        />
        <div class="app-bg__veil" id="bgVeil"></div>
      </div>
    </div>

    <!-- Page shell: full screen on mobile, centred with a maximum width on desktop -->
    <div class="shell">
      <div class="shell__scroll">
        <header class="topbar">
          <div class="brand">
            <span class="brand__title">Calculator</span>
            <span class="brand__meta">
              <span class="brand__sub">832402226</span>
              <span class="brand__tag">H5</span>
            </span>
          </div>

          <div class="topbar__actions">
            <button
              type="button"
              class="chip chip--off"
              id="statusChip"
              title="Click to probe the backend again"
              aria-live="polite"
            >
              <span class="chip__dot" aria-hidden="true"></span>
              <span class="chip__text" id="statusText">Checking backend...</span>
            </button>

            <button type="button" class="chip chip--link" id="historyChip" title="View calculation history">
              <span class="chip__text">History <span id="historyCount">0</span></span>
            </button>
          </div>
        </header>

        <!-- View container: js/router.js mounts the calculator and history views here -->
        <main class="view-root" id="viewRoot"></main>
      </div>
    </div>

    <!-- Toast layer -->
    <div class="toast-layer" id="toastLayer" role="status" aria-live="polite"></div>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
